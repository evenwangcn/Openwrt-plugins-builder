name: Make PassWall run files

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt / ImmortalWrt version
        required: true
        type: choice
        default: "24.10"
        options:
          - "25.12"
          - "24.10"

permissions:
  contents: write

concurrency:
  group: passwall-run-${{ inputs.openwrt_version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      OPENWRT_VERSION: ${{ inputs.openwrt_version }}
      PASSWALL_REPO: Openwrt-Passwall/openwrt-passwall
      KENZOK8_REPO: kenzok8/small
      XRAY_REPO: XTLS/Xray-core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y jq unzip qemu-user

      - name: Resolve upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 包含预发布版，按发布时间选择最新的非草稿 Release。
          # /releases/latest 仅返回正式版，因此使用完整发布列表。
          xray_releases="$(gh api --paginate "repos/${XRAY_REPO}/releases?per_page=100" --slurp)"
          xray_json="$(jq -ec '[.[][] | select(.draft == false and .published_at != null)]
            | max_by(.published_at) // error("No published Xray release found")' <<<"$xray_releases")"
          xray_tag="$(jq -er '.tag_name' <<<"$xray_json")"
          [[ "$xray_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "XRAY_TAG=$xray_tag" >> "$GITHUB_ENV"
          mkdir -p downloads/xray
          printf '%s\n' "$xray_json" > downloads/xray/release.json

          passwall_json="$(gh api "repos/${PASSWALL_REPO}/releases/latest")"
          passwall_tag="$(jq -er '.tag_name' <<<"$passwall_json")"

          # kenzok8 的 tag 格式类似：89-x86_64-24.10.5。
          # 用户只选择 24.10 这类大版本；这里自动选择相应架构下
          # 发布时间最新的 24.10.x Release。
          releases="$(gh api --paginate "repos/${KENZOK8_REPO}/releases?per_page=100" --slurp)"
          for arch in x86_64 aarch64_cortex-a53 aarch64_generic; do
            tag="$(jq -er --arg marker "-${arch}-${OPENWRT_VERSION}." \
              '[.[][] | select(.draft == false and (.tag_name | contains($marker)))]
               | sort_by(.published_at) | reverse | .[0].tag_name' <<<"$releases")"
            printf 'KENZOK8_TAG_%s=%s\n' "${arch//-/_}" "$tag" >> "$GITHUB_ENV"
          done

          echo "PASSWALL_TAG=$passwall_tag" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=passwall-${passwall_tag}-openwrt-${OPENWRT_VERSION}-xray-${xray_tag}" >> "$GITHUB_ENV"
          if [[ "$OPENWRT_VERSION" == "25.12" ]]; then
            echo "PACKAGE_FORMAT=apk" >> "$GITHUB_ENV"
          else
            echo "PACKAGE_FORMAT=ipk" >> "$GITHUB_ENV"
          fi

      - name: Clone makeself
        run: git clone --depth 1 https://github.com/megastep/makeself.git

      - name: Download PassWall LuCI packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloads/main

          if [[ "$PACKAGE_FORMAT" == apk ]]; then
            gh release download "$PASSWALL_TAG" \
              --repo "$PASSWALL_REPO" \
              --dir downloads/main \
              --pattern '25.12+_luci-app-passwall-*.apk' \
              --pattern '25.12+_luci-i18n-passwall-zh-cn-*.apk'
          else
            # OpenWrt 23.05 和 24.10 共用上游的 23.05-24.10 IPK。
            gh release download "$PASSWALL_TAG" \
              --repo "$PASSWALL_REPO" \
              --dir downloads/main \
              --pattern '23.05-24.10_luci-app-passwall_*_all.ipk' \
              --pattern '23.05-24.10_luci-i18n-passwall-zh-cn_*_all.ipk'
          fi

          test "$(find downloads/main -maxdepth 1 -name "*.${PACKAGE_FORMAT}" | wc -l)" -eq 2

      - name: Download dependencies from kenzok8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          download_dependencies() {
            arch="$1"
            tag="$2"
            dest="downloads/depends/${arch}"
            mkdir -p "$dest"

            # small 的 Release 还含 SSR/PassWall2 等 LuCI 插件；run 包只收录
            # PassWall 可使用的运行组件，避免把其他管理插件一起装进路由器。
            local release_id
            release_id="$(gh api "repos/${KENZOK8_REPO}/releases/tags/${tag}" --jq '.id')"
            gh api --paginate "repos/${KENZOK8_REPO}/releases/${release_id}/assets?per_page=100" \
              --jq '.[].browser_download_url' |
              grep -E "/(brook|chinadns-ng|dns2socks|geoview|haproxy|hysteria|ipt2socks|microsocks|naiveproxy|shadowsocks-libev|shadowsocks-rust|shadowsocksr-libev|simple-obfs|sing-box|tcping|trojan-plus|tuic-client|v2ray-geoip|v2ray-geosite|v2ray-plugin|xray-core|xray-plugin|xray[-_][0-9]|shadow-tls)[^/]*\\.${PACKAGE_FORMAT}$" |
              grep -Ev "/sing-box-tiny[^/]*\\.${PACKAGE_FORMAT}$" |
              while IFS= read -r url; do
                curl --fail --location --retry 3 \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H 'Accept: application/octet-stream' \
                  --output "$dest/$(basename "$url")" "$url"
              done

            test -n "$(find "$dest" -maxdepth 1 -name "*.${PACKAGE_FORMAT}" -print -quit)"

            # xray-plugin 不能代替 Xray 核心；缺少核心时禁止发布不完整的 run 包。
            if ! find "$dest" -maxdepth 1 -type f \
              \( -name "xray-core[-_]*.${PACKAGE_FORMAT}" \
                 -o -name "xray[-_][0-9]*.${PACKAGE_FORMAT}" \) -print -quit | grep -q .; then
              echo "Xray core absent from ${tag}; fetching the matching OpenWrt package."
              local stable_version index_url core_name
              stable_version="$(curl --fail --silent --show-error --location --retry 3 \
                https://downloads.openwrt.org/releases/ |
                grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' |
                cut -d '"' -f 2 | tr -d '/' |
                awk -v prefix="${OPENWRT_VERSION}." 'index($0, prefix) == 1' |
                sort -V | tail -n 1)"
              if [[ -z "$stable_version" ]]; then
                echo "::error::No stable OpenWrt release found for ${OPENWRT_VERSION}"
                exit 1
              fi
              index_url="https://downloads.openwrt.org/releases/${stable_version}/packages/${arch}/packages"
              core_name="$(curl --fail --silent --show-error --location --retry 3 "${index_url}/" |
                grep -oE 'href="xray-core[-_][^"]+"' |
                cut -d '"' -f 2 |
                grep -E "\\.${PACKAGE_FORMAT}$")"
              if [[ -z "$core_name" || "$core_name" == *$'\n'* || "$core_name" == */* ]]; then
                echo "::error::Expected one Xray core package at ${index_url}/"
                exit 1
              fi
              echo "Downloading ${index_url}/${core_name}"
              curl --fail --silent --show-error --location --retry 3 \
                --output "$dest/$core_name" "${index_url}/${core_name}"
              test -s "$dest/$core_name"
              printf '%s: %s/%s\n' "$arch" "$index_url" "$core_name" >> downloads/xray-sources.txt
            fi
          }

          download_dependencies x86_64 "$KENZOK8_TAG_x86_64"
          download_dependencies aarch64_cortex-a53 "$KENZOK8_TAG_aarch64_cortex_a53"
          download_dependencies aarch64_generic "$KENZOK8_TAG_aarch64_generic"

      - name: Download and verify latest published Xray
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for target in 64 arm64-v8a; do
            asset="Xray-linux-${target}.zip"
            dest="downloads/xray/${target}"
            mkdir -p "$dest"
            gh release download "$XRAY_TAG" --repo "$XRAY_REPO" \
              --dir "$dest" --pattern "$asset" --pattern "${asset}.dgst"
            # 官方 .dgst 使用 OpenSSL 格式：SHA2-256= ... 或 SHA256= ...。
            digest="$(awk -F= 'toupper($1) ~ /^SHA(2-)?256[[:space:]]*$/ {
              gsub(/[[:space:]]/, "", $2); print tolower($2)
            }' "$dest/${asset}.dgst")"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            (cd "$dest" && printf '%s  %s\n' "$digest" "$asset" | sha256sum -c -)
            unzip -j "$dest/$asset" xray LICENSE -d "$dest"
            chmod +x "$dest/xray"
            if [[ "$target" == 64 ]]; then
              actual="$("$dest/xray" version)"
            else
              actual="$(qemu-aarch64 "$dest/xray" version)"
            fi
            version="$(awk 'NR == 1 && $1 == "Xray" { print $2 }' <<<"$actual")"
            if [[ "$version" != "${XRAY_TAG#v}" ]]; then
              echo "::error::Xray ${target}: expected ${XRAY_TAG#v}, got $version"
              exit 1
            fi
            printf '%s\n' "${XRAY_TAG#v}" > "$dest/version"
            (cd "$dest" && sha256sum xray > SHA256SUMS)
          done

      - name: Assemble package directories
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64_cortex-a53 aarch64_generic; do
            package_dir="passwall_${arch}"
            mkdir -p "$package_dir/depends" "$package_dir/main" "$package_dir/xray"
            case "$arch" in
              x86_64) xray_target=64 ;;
              aarch64_cortex-a53|aarch64_generic) xray_target=arm64-v8a ;;
              *) exit 1 ;;
            esac
            cp downloads/xray/"$xray_target"/{xray,LICENSE,version,SHA256SUMS} "$package_dir/xray/"
            (cd "$package_dir/xray" && sha256sum -c SHA256SUMS)
            cp downloads/depends/"$arch"/*."$PACKAGE_FORMAT" "$package_dir/depends/"
            cp downloads/main/*."$PACKAGE_FORMAT" "$package_dir/main/"

            # sing-box 和 sing-box-tiny 提供相同的二进制及 init 脚本，不能共存。
            # PassWall 使用完整版 sing-box；这里再做一次防御性清理。
            find "$package_dir/depends" -maxdepth 1 \
              -type f -name "sing-box-tiny*.${PACKAGE_FORMAT}" -delete
            test -n "$(find "$package_dir/depends" -maxdepth 1 \
              -type f -name "sing-box*.${PACKAGE_FORMAT}" \
              ! -name "sing-box-tiny*.${PACKAGE_FORMAT}" -print -quit)"

            cat > "$package_dir/install.sh" <<'INSTALL_SCRIPT'
          #!/bin/sh
          set -e
          cd "$(dirname "$0")"

          # 安装任何软件包前先验证随包核心能在目标设备运行。
          (cd xray && sha256sum -c SHA256SUMS)
          expected="$(cat xray/version)"
          actual="$(./xray/xray version)"
          actual="$(printf '%s\n' "$actual" | awk 'NR == 1 && $1 == "Xray" {print $2}')"
          [ "$actual" = "$expected" ] || { echo "Xray version mismatch"; exit 1; }

          if command -v apk >/dev/null 2>&1; then
              apk update
              apk add --allow-untrusted depends/*.apk
              apk add --allow-untrusted main/*.apk
          elif command -v opkg >/dev/null 2>&1; then
              opkg update
              opkg install iptables-mod-tproxy iptables-mod-socket \
                iptables-mod-iprange iptables-mod-conntrack-extra
              opkg install depends/*.ipk
              opkg install main/*.ipk
          else
              echo "Error: neither apk nor opkg was found."
              exit 1
          fi
          # 最后替换，避免依赖安装将官方核心覆盖。包元数据保留源包版本。
          tmp_xray="$(mktemp /usr/bin/.xray.XXXXXX)"
          trap 'rm -f "$tmp_xray"' EXIT HUP INT TERM
          cp ./xray/xray "$tmp_xray"
          chmod 755 "$tmp_xray"
          mv -f "$tmp_xray" /usr/bin/xray
          trap - EXIT HUP INT TERM
          /usr/bin/xray version
          if [ -x /etc/init.d/passwall ]; then
              /etc/init.d/passwall restart
          fi
          /etc/init.d/rpcd restart 2>/dev/null || true
          /etc/init.d/uhttpd restart 2>/dev/null || true
          INSTALL_SCRIPT
            chmod +x "$package_dir/install.sh"
          done

      - name: Create self-extracting packages
        run: |
          set -euo pipefail
          ./makeself/makeself.sh passwall_x86_64 \
            "passwall_x86_64_openwrt-${OPENWRT_VERSION}_${PASSWALL_TAG}.run" \
            "PassWall ${PASSWALL_TAG} for OpenWrt ${OPENWRT_VERSION} x86_64" \
            ./install.sh
          ./makeself/makeself.sh passwall_aarch64_cortex-a53 \
            "passwall_aarch64_cortex-a53_openwrt-${OPENWRT_VERSION}_${PASSWALL_TAG}.run" \
            "PassWall ${PASSWALL_TAG} for OpenWrt ${OPENWRT_VERSION} aarch64_cortex-a53" \
            ./install.sh
          ./makeself/makeself.sh passwall_aarch64_generic \
            "passwall_aarch64_generic_openwrt-${OPENWRT_VERSION}_${PASSWALL_TAG}.run" \
            "PassWall ${PASSWALL_TAG} for OpenWrt ${OPENWRT_VERSION} aarch64_generic" \
            ./install.sh
          ls -lh passwall_*.run
          test "$(find . -maxdepth 1 -type f -name 'passwall_*.run' | wc -l)" -eq 3

      - name: Create release notes
        run: |
          cat > release_notes.md <<EOF
          PassWall: ${PASSWALL_TAG}

          Xray core: ${XRAY_TAG} (latest published release, including prereleases)
          Source: https://github.com/${XRAY_REPO}/releases/tag/${XRAY_TAG}
          The installer replaces /usr/bin/xray after installing IPK/APK dependencies.
          Package-manager metadata retains the dependency package version; use xray version to check the actual core.
          A later package-manager upgrade may replace this binary; rerun this installer to restore the bundled core.

          OpenWrt / ImmortalWrt: ${OPENWRT_VERSION}

          Dependencies:
          - x86_64: kenzok8/small ${KENZOK8_TAG_x86_64}
          - aarch64_cortex-a53: kenzok8/small ${KENZOK8_TAG_aarch64_cortex_a53}
          - aarch64_generic: kenzok8/small ${KENZOK8_TAG_aarch64_generic}
          EOF
          if [ -f downloads/xray-sources.txt ]; then
            printf '\nXray dependency package fallback sources (binary replaced with latest published Xray):\n' >> release_notes.md
            cat downloads/xray-sources.txt >> release_notes.md
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: PassWall ${{ env.PASSWALL_TAG }} - OpenWrt ${{ env.OPENWRT_VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: release_notes.md
          files: passwall_*.run
          fail_on_unmatched_files: true
